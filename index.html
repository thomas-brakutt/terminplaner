<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminplaner</title>
    <script src="script.js" defer></script>
    <!-- defer = lädt die JavaScript-Datei, während er das HTML verarbeitet, führt sie aber erst aus, nachdem das HTML vollständig eingelesen wurde -->
</head>

<body>
    <h1>Terminplaner</h1>
    <h2>Neue Termine</h2>
    <form id="appointmentForm">

        <label for="dateInput">Datum:</label>
        <input type="date" id="dateInput" required>

        <label for="timeInput">Uhrzeit:</label>
        <input type="time" id="timeInput" required>

        <label for="terminInput">Termintitel:</label>
        <input type="text" id="terminInput" required>

        <button id="addTerminButton" type="submit">
            Termin hinzufügen
        </button>
    </form>
    <h2>Meine Termine</h2>
    <ul id="terminList">
    </ul>

</body>

</html>
